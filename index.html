<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SDF.js — Baker & Viewer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
        }

        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas.dragging { cursor: grabbing; }

        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: #0ff;
            background: rgba(0, 8, 16, 0.92);
            padding: 20px 24px;
            border: 1px solid #0ff;
            border-top: 3px solid #0ff;
            z-index: 10;
            min-width: 300px;
            box-shadow: 0 0 30px rgba(0,255,255,0.15), inset 0 0 20px rgba(0,255,255,0.03);
        }

        #ui h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #0ff;
            margin: 0 0 16px;
            text-transform: uppercase;
        }

        .section-label {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: #068;
            text-transform: uppercase;
            margin: 14px 0 6px;
        }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .file-btn {
            display: inline-block;
            background: transparent;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 6px 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            letter-spacing: 0.05em;
        }
        .file-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .file-btn.accent { border-color: #f0a; color: #f0a; }
        .file-btn.accent:hover { background: rgba(255,0,170,0.1); box-shadow: 0 0 10px rgba(255,0,170,0.3); }
        .file-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        input[type="file"] { display: none; }

        .res-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        select {
            background: #000;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 5px 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            cursor: pointer;
        }

        #status {
            margin-top: 14px;
            font-size: 11px;
            color: #8ef;
            min-height: 16px;
            letter-spacing: 0.05em;
        }

        #progressBar {
            margin-top: 8px;
            height: 3px;
            background: #011;
            width: 100%;
            display: none;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #0ff, #0f8);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 6px #0ff;
        }

        .hint {
            margin-top: 10px;
            font-size: 10px;
            color: #046;
            letter-spacing: 0.05em;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.04) 2px,
                rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="scanline"></div>

<div id="ui">
    <h2>SDF.js — Baker & Viewer</h2>

    <div class="section-label">Import</div>
    <div class="btn-row">
        <label class="file-btn" for="objInput">[ .obj → bake ]</label>
        <input type="file" id="objInput" accept=".obj">
        <label class="file-btn" for="sdfInput">[ load .sdf ]</label>
        <input type="file" id="sdfInput" accept=".sdf">
    </div>

    <div class="section-label">Bake Resolution</div>
    <div class="res-row">
        <select id="resSelect">
            <option value="32">32³ — fast draft</option>
            <option value="48" selected>48³ — balanced</option>
            <option value="64">64³ — high quality</option>
            <option value="96">96³ — slow / fine</option>
        </select>
    </div>

    <div class="section-label">Export</div>
    <div class="btn-row">
        <button class="file-btn accent" id="exportBtn" disabled>[ save .sdf ]</button>
    </div>

    <div id="status">Ready. Load an .obj to bake, or a .sdf to view.</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
</div>

<canvas id="glCanvas"></canvas>

<script>
/* =========================================================
   WEB WORKER BLOB — baking runs off the main thread
   ========================================================= */
const WORKER_SRC = `
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function dot2(v){return dot(v,v);}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function scale(v,s){return[v[0]*s,v[1]*s,v[2]*s];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

function distToTriangle(p,v0,v1,v2){
    const v10=sub(v1,v0),p0=sub(p,v0);
    const v21=sub(v2,v1),p1=sub(p,v1);
    const v02=sub(v0,v2),p2=sub(p,v2);
    const nor=cross(v10,v02);
    const inFace=(Math.sign(dot(cross(v10,nor),p0))+
                  Math.sign(dot(cross(v21,nor),p1))+
                  Math.sign(dot(cross(v02,nor),p2)))>=2.0;
    let d2;
    if(inFace){
        const dn=dot2(nor);
        if(dn<1e-12)return 0;
        const nd=dot(nor,p0);
        d2=nd*nd/dn;
    } else {
        const e0=sub(scale(v10,clamp(dot(v10,p0)/dot2(v10),0,1)),p0);
        const e1=sub(scale(v21,clamp(dot(v21,p1)/dot2(v21),0,1)),p1);
        const e2=sub(scale(v02,clamp(dot(v02,p2)/dot2(v02),0,1)),p2);
        d2=Math.min(dot2(e0),dot2(e1),dot2(e2));
    }
    return Math.sqrt(Math.max(0,d2));
}

// ADDED: Signed SDF: parity test along +X axis to determine inside/outside
function pointInMesh(point, tris, numTris) {
    let count = 0;
    for (let t = 0; t < numTris; t++) {
        const base = t*9;
        const v0 = [tris[base],   tris[base+1], tris[base+2]];
        const v1 = [tris[base+3], tris[base+4], tris[base+5]];
        const v2 = [tris[base+6], tris[base+7], tris[base+8]];
        const dir = [1,0,0];
        const edge1 = sub(v1, v0), edge2 = sub(v2, v0);
        const h = cross(dir, edge2);
        const a = dot(edge1, h);
        if (Math.abs(a) < 1e-8) continue;
        const f = 1.0 / a;
        const s = sub(point, v0);
        const u = f * dot(s, h);
        if(u < 0 || u > 1) continue;
        const q = cross(s, edge1);
        const v = f * dot(dir, q);
        if(v < 0 || u + v > 1) continue;
        const tval = f * dot(edge2, q);
        if(tval >= 0) count++;
    }
    return (count % 2) === 1;
}

self.onmessage = function(e) {
    const { tris, numTris, res } = e.data;
    const total = res*res*res;
    const sdfData = new Float32Array(total);
    const BATCH_Z = 4; // bigger batches are fine off-thread
    let z = 0;

    function processChunk() {
        const zEnd = Math.min(z + BATCH_Z, res);
        for (; z < zEnd; z++) {
            for (let y = 0; y < res; y++) {
                for (let x = 0; x < res; x++) {
                    const p = [
                        (x/(res-1)-0.5)*2,
                        (y/(res-1)-0.5)*2,
                        (z/(res-1)-0.5)*2
                    ];
                    let minDist = 1e9;
                    for (let t = 0; t < numTris; t++) {
                        const base = t*9;
                        const d = distToTriangle(p,
                            [tris[base],   tris[base+1], tris[base+2]],
                            [tris[base+3], tris[base+4], tris[base+5]],
                            [tris[base+6], tris[base+7], tris[base+8]]
                        );
                        if(d<minDist)minDist=d;
                    }
                    const sign = pointInMesh(p, tris, numTris) ? -1 : 1;
                    sdfData[x + y*res + z*res*res] = minDist * sign;
                }
            }
        }
        self.postMessage({ type: 'progress', z, res });
        if (z < res) setTimeout(processChunk, 0);
        else self.postMessage({ type: 'done', sdfData }, [sdfData.buffer]);
    }
    processChunk();
};
`;
